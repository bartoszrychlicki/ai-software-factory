# Routing: etap[.domena] -> silnik[/model]
# Rozstrzyganie: label engine:* na tickecie > projects.<projekt> > defaults.<etap.domena> > defaults.<etap>
# Wartość wpisu: skalar (brak zapasu) albo lista 1–2 specyfikacji:
#   plan:
#     - claude-code/claude-fable-5@high   # główny
#     - claude-code/claude-opus-5@high    # zapas (tylko przy AWARII silnika głównego)
# Zapas NIE rusza przy wyniku merytorycznym (BLOCKED, brak werdyktu, uwagi recenzji)
# ani przy wyczerpanym budżecie ticketu. Maksymalnie jedno przejście na próbę etapu.
defaults:
  plan: claude-code/sonnet
  build: codex              # bez modelu = default CLI
  verify: claude-code/sonnet
  review: claude-code/sonnet   # doradcze; niezależny od buildera (codex)
  review.diverse: codex        # fallback dywersyfikacji: gdy reviewer == builder (np. br-budget frontend)
  build.frontend: codex        # sandboxowany default; Kimi wymaga jawnego FACTORY_ALLOW_UNSANDBOXED_KIMI=1
  # v3 deep-plan (aktywny tylko dla projektów z planPipeline: v3 w projects.yaml)
  triage: claude-code/haiku            # tani klasyfikator przed drogim researchem
  research.recon: claude-code/sonnet
  research.solution-a: claude-code/sonnet
  research.solution-b: codex
  synthesis: claude-code/sonnet
  critique: codex                      # wymóg: silnik ≠ synteza
  critique.diverse: claude-code/sonnet # fallback MUSI być innym silnikiem niż critique

# spec: silnik[/model[@effort]]; effort: low/medium/high/xhigh (claude --effort, codex -c model_reasoning_effort)
projects:
  pilot-app:
    verify: pi/qwen/qwen3.6-27b

  br-budget:
    plan: claude-code/claude-fable-5@high
    build: codex/gpt-5.6-sol@xhigh
    build.frontend: claude-code/claude-opus-4-8@high   # kimi poza br-budget do czasu dual-planowania (decyzja 2026-07-20)
    verify: claude-code/claude-opus-4-8@high
    review: claude-code/claude-fable-5@medium
    # fix idzie trasą build (ta sama reguła co w pipeline)
    # v3 deep-plan — modele wg decyzji Bartosza 2026-07-29 („max" = xhigh):
    triage: codex/gpt-5.6-terra
    research.recon: claude-code/claude-opus-5@high
    research.solution-a: claude-code/claude-fable-5@high
    research.solution-b: codex/gpt-5.6-sol@xhigh
    synthesis: claude-code/claude-opus-5@xhigh
    critique: codex/gpt-5.6-sol@xhigh
    # fallback, gdy codex byłby wykluczony (np. synteza przeniesiona na codex):
    critique.diverse: claude-code/claude-fable-5@medium
